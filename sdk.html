<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>填入小红书（鸿蒙版）</title>
<style>
body{background:#f6f5f1;font:16px/1.7 system-ui;color:#222;margin:0;padding:16px}
main{max-width:600px;margin:auto;background:white;border-radius:16px;padding:20px}
.warn{background:#fff4e5;border-left:4px solid #e0a030;padding:10px 12px;border-radius:6px;font-size:14px;margin:12px 0}
.warn b{color:#c8322b}
.images{display:flex;gap:8px;overflow:auto;margin:12px 0}
.images img{width:120px;height:160px;object-fit:contain;border:1px solid #eee;border-radius:8px}
pre{white-space:pre-wrap;font:inherit;background:#fafaf8;padding:12px;border-radius:8px;max-height:220px;overflow:auto}
button{display:block;width:100%;border:0;padding:17px;border-radius:10px;
  background:#ed334b;color:white;font-size:18px;font-weight:600;margin:14px 0}
button:disabled{background:#ccc}
button.alt{background:#f2f2f4;color:#333;font-size:15px;padding:12px;font-weight:400}
small{color:#777;display:block;margin-top:8px;font-size:13px}
h2{font-size:18px;margin:16px 0 6px}
#status{color:#c8322b;font-size:14px;min-height:22px}
</style>
<main>
  <h1 style="font-size:19px;margin:0 0 2px">填入小红书</h1>
  <small style="margin:0">鸿蒙专用 · 官方 SDK 链接</small>

  <div class="warn">
    <b>连续发会被限流</b>：前 2 篇正常，第 3 篇起小红书只把 App 拉起来、不传内容。<br>
    ⇒ 每篇之间<b>间隔 15 分钟以上</b>；发完先把小红书从后台<b>划掉</b>再点下一篇。
  </div>

  <button id="go" disabled>正在读取…</button>
  <button id="reload" class="alt" hidden>刷新数据（间隔够了点这个）</button>
  <button id="copy" class="alt" hidden>复制标题和正文</button>
  <button id="copyLink" class="alt" hidden>复制直连（粘到浏览器地址栏）</button>
  <p id="status" role="status"></p>

  <div id="images" class="images"></div>
  <h2 id="title"></h2>
  <pre id="content"></pre>
  <small>图片：长按可存相册。红按钮没反应就杀掉小红书后台，点「刷新数据」再试。</small>
</main>
<script>
function topicText(c){
  return c.replace(/(^|\s)#([^\s#\[\]]+)(?:\[话题\]#|#)?/g,(_,s,n)=>s+'#'+n+'[话题]#');
}
const el=id=>document.getElementById(id);
const taskId=new URLSearchParams(location.search).get('task');
let task, sdkUrl='';

function buildSdkUrl(){
  const data={
    share_type:'note', sdk_version:'1.0.4',
    third_app_package:'system_album_other', third_app_version:'1.0.0',
    share_session_id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
    did:'', start_share_timestamp:Date.now(), fromJsSdk:false,
    note_info:{
      title:{value:task.title},
      content:{value:topicText(task.content)},
      image_info:task.images.map(u=>({uri:null,url:u}))
    }
  };
  const bytes=new TextEncoder().encode(JSON.stringify(data));
  const b64=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));
  return 'https://www.xiaohongshu.com/open/new_sdk/ul?data='+encodeURIComponent(b64);
}

function load(){
  el('go').disabled=true; el('go').textContent='正在读取…'; el('status').textContent='';
  el('images').innerHTML='';
  fetch('https://api.github.com/repos/sijidou-63/xhs-harmony-fill-test/releases/tags/'+encodeURIComponent(taskId)+'?t='+Date.now())
  .then(async r=>{
    const release=await r.json();
    if(!r.ok) throw Error(r.status===404?'任务不存在或已删除':'读取失败，请重试');
    const d=JSON.parse(release.body);
    if(Date.now()>d.expiresAt) throw Error('任务已过期，请在电脑重新生成');
    task=d;
    el('title').textContent=d.title;
    el('content').textContent=d.content;
    for(const url of d.images){
      const img=document.createElement('img'); img.src=url; el('images').append(img);
    }
    sdkUrl=buildSdkUrl();
    el('go').disabled=false; el('go').textContent='打开小红书并填入图文';
    el('reload').hidden=false; el('copy').hidden=false; el('copyLink').hidden=false;
  })
  .catch(e=>{ el('status').textContent=e.message; el('go').textContent='读取失败，点刷新重试'; el('reload').hidden=false; });
}

el('go').onclick=()=>{
  if(!task) return;
  sdkUrl=buildSdkUrl();                 // 每次点都换新的 session_id + 时间戳
  el('status').textContent='已请求打开小红书，请稍候…';
  location.href=sdkUrl;
};
el('reload').onclick=load;

el('copy').onclick=async()=>{
  const txt=task?task.title+'\n\n'+task.content:'';
  try{ await navigator.clipboard.writeText(txt); el('status').textContent='已复制标题和正文'; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    el('status').textContent='已复制标题和正文';
  }
};
el('copyLink').onclick=async()=>{
  if(!task) return;
  sdkUrl=buildSdkUrl();
  try{ await navigator.clipboard.writeText(sdkUrl); el('status').textContent='已复制直连，粘到浏览器地址栏回车'; }
  catch(e){ el('status').textContent='复制失败，长按下面内容手动选'; }
};

load();
</script>
</html>
