<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>填入小红书（鸿蒙版）</title>
<style>
body{background:#f6f5f1;font:16px/1.7 system-ui;color:#222;margin:0;padding:18px}
main{max-width:600px;margin:auto;background:white;border-radius:16px;padding:22px}
.images{display:flex;gap:8px;overflow:auto;margin:12px 0}
.images img{width:130px;height:174px;object-fit:contain;border:1px solid #eee;border-radius:8px}
pre{white-space:pre-wrap;font:inherit;background:#fafaf8;padding:12px;border-radius:8px}
button{display:block;width:100%;border:0;padding:18px;border-radius:10px;
  background:#ed334b;color:white;font-size:19px;font-weight:600;margin:18px 0}
button:disabled{background:#ccc}
button.alt{background:#f2f2f4;color:#333;font-size:15px;padding:13px;font-weight:400}
small{color:#777;display:block;margin-top:10px}
h2{font-size:19px;margin:18px 0 6px}
</style>
<main>
  <h1 style="font-size:20px;margin:0 0 4px">填入小红书</h1>
  <small style="margin:0">鸿蒙专用 · 走官方 SDK 链接，不用 xhsdiscover 深链</small>
  <button id="go" disabled>正在读取…</button>
  <button id="copy" class="alt" hidden>复制标题和正文（手动发用）</button>
  <p id="status" role="status" style="color:#c8322b;font-size:14px"></p>
  <div id="images" class="images"></div>
  <h2 id="title"></h2>
  <pre id="content"></pre>
  <small>点上方红按钮会唤起小红书编辑页。若没反应，长按下面图片存到相册，再用「复制标题和正文」手动发。</small>
</main>
<script>
function topicText(c){
  return c.replace(/(^|\s)#([^\s#\[\]]+)(?:\[话题\]#|#)?/g,(_,s,n)=>s+'#'+n+'[话题]#');
}
const el=id=>document.getElementById(id);
const taskId=new URLSearchParams(location.search).get('task');
let task;

fetch('https://api.github.com/repos/sijidou-63/xhs-harmony-fill-test/releases/tags/'+encodeURIComponent(taskId))
.then(async r=>{
  const release=await r.json();
  if(!r.ok) throw Error(r.status===404?'任务不存在或已删除':'读取失败，请重试');
  const d=JSON.parse(release.body);
  if(Date.now()>d.expiresAt) throw Error('任务已过期，请在电脑重新生成');
  task=d;
  el('title').textContent=d.title;
  el('content').textContent=d.content;
  for(const url of d.images){
    const img=document.createElement('img'); img.src=url; el('images').append(img);
  }
  el('go').disabled=false; el('go').textContent='打开小红书并填入图文';
  el('copy').hidden=false;
})
.catch(e=>{ el('status').textContent=e.message; el('go').textContent='无法读取任务'; });

// 只走官方 SDK 链接（鸿蒙不认 xhsdiscover://）
function openSdk(){
  const content=topicText(task.content);
  const data={
    share_type:'note', sdk_version:'1.0.4',
    third_app_package:'system_album_other', third_app_version:'1.0.0',
    share_session_id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),
    did:'', start_share_timestamp:Date.now(), fromJsSdk:false,
    note_info:{
      title:{value:task.title},
      content:{value:content},
      image_info:task.images.map(u=>({uri:null,url:u}))
    }
  };
  const bytes=new TextEncoder().encode(JSON.stringify(data));
  const b64=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));
  el('status').textContent='已请求打开小红书，请稍候…';
  location.href='https://www.xiaohongshu.com/open/new_sdk/ul?data='+encodeURIComponent(b64);
}
el('go').onclick=openSdk;

el('copy').onclick=async()=>{
  const txt=task.title+'\n\n'+task.content;
  try{ await navigator.clipboard.writeText(txt); el('status').textContent='已复制，去小红书手动粘贴'; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    el('status').textContent='已复制，去小红书手动粘贴';
  }
};
</script>
</html>
