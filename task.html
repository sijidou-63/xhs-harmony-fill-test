<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机图文填入</title><style>body{background:#f6f5f1;font:16px/1.7 system-ui;color:#222;margin:0;padding:20px}main{max-width:600px;margin:auto;background:white;border-radius:16px;padding:22px}.images{display:flex;gap:8px;overflow:auto}.images img{width:150px;height:200px;object-fit:contain}pre{white-space:pre-wrap;font:inherit}button{display:block;width:100%;border:0;padding:16px;border-radius:10px;background:#ed334b;color:white;font-size:18px;margin:20px 0}small{color:#777}</style><main><h1>手机图文填入</h1><button id="open" disabled>正在读取图文…</button><p id="status" role="status"></p><p>鸿蒙相机或系统扫一扫扫码，在华为浏览器打开；微信扫码后请选择在浏览器打开。</p><div id="images" class="images"></div><h2 id="title"></h2><pre id="content"></pre><small>填入后检查图片顺序、标题正文和话题，再手动保存草稿。此页面无法确认 App 内的保存结果。</small></main><script>
function topicText(content){return content.replace(/(^|\s)#([^\s#\[\]]+)(?:\[话题\]#|#)?/g,(_,space,name)=>space+'#'+name+'[话题]#')}
let task;const el=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('task');
fetch('https://api.github.com/repos/sijidou-63/xhs-harmony-fill-test/releases/tags/'+encodeURIComponent(id)).then(async r=>{const release=await r.json();if(!r.ok)throw Error(r.status===404?'任务不存在或已删除':'读取任务失败，请稍后重试');const d=JSON.parse(release.body);if(Date.now()>d.expiresAt)throw Error('任务已过期，请在电脑重新生成');d.images=release.assets.sort((a,b)=>a.name.localeCompare(b.name)).map(a=>a.browser_download_url);task=d;el('title').textContent=d.title;el('content').textContent=d.content;for(const [i,url] of d.images.entries()){const img=document.createElement('img');img.src=url;img.alt='第'+(i+1)+'张';el('images').append(img)}el('open').disabled=false;el('open').textContent='打开小红书并填入'}).catch(e=>{el('status').textContent=e.message;el('open').textContent='无法读取任务'});
el('open').onclick=()=>{const content=topicText(task.content);const data={share_type:'note',sdk_version:'1.0.4',third_app_package:'system_album_other',third_app_version:'1.0.0',share_session_id:crypto.randomUUID(),did:'',start_share_timestamp:Date.now(),fromJsSdk:false,note_info:{title:{value:task.title},content:{value:content},image_info:task.images.map(url=>({uri:null,url}))}};const bytes=new TextEncoder().encode(JSON.stringify(data));const encoded=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));el('status').textContent='已请求打开小红书，请检查完整图文并手动保存草稿。';location.href='https://www.xiaohongshu.com/open/new_sdk/ul?data='+encodeURIComponent(encoded)};
</script></html>
