<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小红书手机图文测试</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ed334b%22/%3E%3Cpath d=%22M9 8h14v16H9z%22 fill=%22white%22/%3E%3Cpath d=%22M12 12h8M12 16h8M12 20h5%22 stroke=%22%23ed334b%22 stroke-width=%222%22/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}body{font:16px/1.7 system-ui;background:#f6f6f6;color:#222;margin:0;padding:24px}main{max-width:560px;margin:auto;background:white;padding:24px;border-radius:16px}img{width:46%;margin:1%;border-radius:8px}button{display:block;width:100%;padding:15px;margin:16px 0;background:#ed334b;color:white;border:0;border-radius:10px;font-size:18px}pre{white-space:pre-wrap;background:#f5f5f5;padding:12px}small{color:#666}</style>
<main><h1 id="heading">手机图文填入测试</h1><p id="instructions">在微信中，请点右上角“…” → 在浏览器打开，再点击下方按钮。</p>
<img src="./test-1.png" alt="第1张"><img src="./test-2.png" alt="第2张">
<h3 id="title"></h3><pre id="body"></pre>
<button id="open">打开小红书并填入</button><button id="alternate" hidden>测试二：另一种图文跳转</button><p id="status">等待点击</p>
<p>进入小红书后，检查两张图片的顺序、标题和正文。请手动保存草稿，再重新打开确认。</p>
<small>本页只能记录按钮点击，无法判断小红书是否已填入或已保存。测试内容不含真实经营素材。</small></main>
<script>
const harmony=new URLSearchParams(location.search).get('platform')==='harmony';
const ios=new URLSearchParams(location.search).get('platform')==='ios'||/iPhone|iPad|iPod/.test(navigator.userAgent);
const title=(harmony?'鸿蒙':ios?'iPhone':'安卓')+'扫码图文测试';
document.getElementById('heading').textContent=(ios?'iPhone':'安卓')+'图文填入测试';
if(ios)document.getElementById('instructions').textContent='微信右上角“…” → 在默认浏览器打开，使用 Safari 后点击下方按钮。';
const content='这是电脑发送到手机的测试正文。\n第二行：检查中文、换行和标点。\n图片顺序应为第1张、第2张。\n#入额考试[话题]# #主观题[话题]#';
document.getElementById('title').textContent=title;
document.getElementById('body').textContent=content;
if(harmony){document.getElementById('instructions').textContent='微信扫码后，右上角“…” → 在系统浏览器打开。先点测试一；未填入图文时返回本页，再点测试二。';document.getElementById('open').textContent='测试一：打开小红书并填入';document.getElementById('alternate').hidden=false;}
function openNote(usePost){
 const imageUrls=[1,2].map(n=>new URL('./test-'+n+'.png',location.href).href);
 document.getElementById('status').textContent='已点击唤起，请在小红书中确认实际填入结果。';
 if(usePost){
  const attach={image_resources:imageUrls.map(url=>({image_url:url,url,imageUrl:url,uri:url})),images:imageUrls,note_title:title,note_text:content,note_text_v2:{content},now_edit_info:{tti_open_keyboard:false}};
  const page={page_type:'photo_publish'};
  const source={type:'system_album_other',externalSource:'content_distribution_center',extraInfo:{subType:'external_app'}};
  const params=new URLSearchParams({attach:JSON.stringify(attach),page:JSON.stringify(page),source:JSON.stringify(source)});
  location.href='xhsdiscover://post_new_note?'+params.toString();
  return;
 }
 const sessionId=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('').replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/,'$1-$2-$3-$4-$5');
 const data={share_type:'note',sdk_version:'1.0.0',third_app_package:'system_album_other',third_app_version:'1.0.0',share_session_id:sessionId,did:'',start_share_timestamp:Date.now(),fromJsSdk:false,note_info:{title:{value:title},content:{value:content},image_info:[1,2].map(n=>({uri:null,url:new URL('./test-'+n+'.png',location.href).href}))}};
 const bytes=new TextEncoder().encode(JSON.stringify(data));
 const encoded=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));
 location.href='xhsdiscover://share_sdk?data='+encodeURIComponent(encoded);
}
document.getElementById('open').onclick=()=>openNote(ios||harmony);
document.getElementById('alternate').onclick=()=>openNote(false);
</script></html>
